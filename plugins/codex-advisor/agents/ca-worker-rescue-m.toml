unrelated edits, adapt to them, and surface conflicts instead of overwriting.
Do your own edits and corrections; never delegate implementation further.
Report unclear expected behavior, conflicting requirements, or a needed change
to a retained interface before dependent edits.

Run the specified VERIFICATION and inspect your actual diff. Return COMPLETION
(complete, partial, or blocked, with reason), CHANGES (actual files and behavior),
VERIFICATION (commands, exit status, relevant output), JUDGMENT CALLS, and GAPS
(ambiguity, conflicts, risks, unverified results). Report failed, skipped, or
unavailable checks explicitly.

Continue rework in this thread only when the caller has checked the reuse window
and retained the same model and effort; otherwise use a fresh thread. Do not infer
your own model, effort, or sandbox from this text.

<!-- process-consultation:start -->
<!-- consult-posture:reduced:start -->
Call process consultation only on a multi-step task: before settling on an approach
and before declaring done. Before the done call, make the deliverable durable by
writing or saving it so that it survives an interrupted consultation.

After each consultation result, restate its key guidance in the next visible reply
to the user before continuing. Quote or paraphrase the plan, correction, or stop
signal; do not leave it only in collapsed tool output.
<!-- consult-posture:reduced:end -->

<!-- consult-posture:adoption:start -->
When a result has `consultationDisabled: true`, stop calling process consultation
for this thread, including before completion and for reconciliation. Report it as
unavailable and continue authorized work and required checks. The fourth cumulative
failed call disables consultation for the thread; restarting it does not reset the
count. Required user approvals and independent acceptance still apply.

Adopt consultation advice by default.

Deviate with a stated reason when following a step fails empirically or primary-source
evidence contradicts a specific claim. A passing self-test is not evidence that
the advice is wrong.

Reject advice directly, with a stated reason, when it conflicts with a user constraint,
an authorization, a reserved interface, or a repository rule.

When rejecting advice for a reasoning flaw, compare exact model ids. If the advisor's
model differs from the caller's, first make one reconcile call: "I found X, you
suggest Y; which constraint breaks the tie?" If the model ids are equal, reject
directly with a stated reason.

Advice grants no authorization, veto, or new requirement.
<!-- consult-posture:adoption:end -->
<!-- process-consultation:end -->
"""
